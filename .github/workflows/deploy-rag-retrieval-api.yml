name: Deploy RAG Retrieval API to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Cloud Run Service Name'
        required: true
        default: 'rag-retrieval-api'
        type: string
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'asia-south1'
        type: choice
        options:
          - asia-south1
          - us-central1
          - us-east1
          - us-west1
          - europe-west1
      memory:
        description: 'Memory allocation for Cloud Run'
        required: true
        default: '4Gi'
        type: choice
        options:
          - 2Gi
          - 4Gi
          - 8Gi

jobs:
  deploy:
    name: Build & Deploy RAG Retrieval API to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry Repository if not exists
        run: |
          gcloud artifacts repositories create agent \
            --repository-format=docker \
            --location=${{ inputs.region }} \
            --description="Docker repository for Cloud Run deployments" || true

      - name: Build and Push Docker Image via Cloud Build
        working-directory: rag/retrival_pipe_api
        run: |
          IMAGE_URI="${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agent/${{ inputs.service_name }}:${{ github.sha }}"
          echo "=========================================================="
          echo "🚀 Submitting build to Cloud Build..."
          echo "=========================================================="
          gcloud builds submit --tag $IMAGE_URI .

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agent/${{ inputs.service_name }}:${{ github.sha }}"
          echo "=========================================================="
          echo "☸️ Deploying to Cloud Run (${{ inputs.service_name }})..."
          echo "=========================================================="
          gcloud run deploy ${{ inputs.service_name }} \
            --image $IMAGE_URI \
            --region ${{ inputs.region }} \
            --platform managed \
            --allow-unauthenticated \
            --memory ${{ inputs.memory }} \
            --set-env-vars \
              QDRANT_END_POINT=${{ secrets.QDRANT_END_POINT }},\
              QDRANT_API=${{ secrets.QDRANT_API }}
          echo "=========================================================="
          echo "✅ Deployment completed successfully!"
          echo "=========================================================="
