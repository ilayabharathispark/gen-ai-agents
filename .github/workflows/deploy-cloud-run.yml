name: Deploy ADK Agent to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Cloud Run Service Name'
        required: true
        default: 'adk-agent-memorybank'
        type: string
      working_directory:
        description: 'Working Directory'
        required: true
        default: 'adk_agent_memorybank'
        type: string
      region:
        description: 'Google Cloud Region'
        required: true
        default: 'asia-south1'
        type: choice
        options:
          - us-central1
          - us-east1
          - us-west1
          - asia-south1
          - europe-west1
      memory_service_uri:
        description: 'Memory Service URI (e.g. agentengine://projects/.../locations/.../reasoningEngines/...)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry Repository if not exists
        run: |
          gcloud artifacts repositories create agent \
            --repository-format=docker \
            --location=${{ inputs.region }} \
            --description="Docker repository for Cloud Run deployments" || true

      - name: Build and Push Docker Image
        working-directory: ${{ inputs.working_directory }}
        run: |
          IMAGE_URI="${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agent/${{ inputs.service_name }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service_name }}
          region: ${{ inputs.region }}
          image: ${{ inputs.region }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/agent/${{ inputs.service_name }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=${{ inputs.region }}
            GOOGLE_GENAI_USE_VERTEXAI=true
            MEMORY_SERVICE_URI=${{ inputs.memory_service_uri }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            REDIS_SESSION_TTL=7200
            REDIS_CONTEXT_WINDOW=10
            LANGSMITH_TRACING=true
            LANGSMITH_ENDPOINT=https://api.smith.langchain.com
            LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
            LANGSMITH_PROJECT=memory-adk

